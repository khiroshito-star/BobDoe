name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" || -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            archive="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            [[ -n "$archive" ]] || { echo "No source ZIP found." >&2; exit 1; }

            source_dir="$RUNNER_TEMP/android-source"
            mkdir -p "$source_dir"
            unzip -q "$archive" -d "$source_dir"

            settings_file="$(find "$source_dir" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            [[ -n "$settings_file" ]] || { echo "ZIP does not contain a Gradle Android project." >&2; exit 1; }

            project_dir="$(dirname "$settings_file")"
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" ControlCenterOverlay.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlCenterOverlay-debug-apk
          path: ControlCenterOverlay.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Control Center APK (build ${{ github.run_number }})
          files: ControlCenterOverlay.apk
          make_latest: true
